spring.application.name=personal-finance-backend
spring.profiles.active=local
spring.config.import=optional:file:.env.properties

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Our ResponseStatusException messages (e.g. "Email is already registered") are
# intentionally client-facing, not stack traces — safe to surface them.
server.error.include-message=always